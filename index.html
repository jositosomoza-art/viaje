<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Para ti 💌</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  min-height: 100%;
}

body {
  min-height: 100vh;
  font-family: Georgia, "Times New Roman", serif;
  background:
    radial-gradient(circle at 20% 20%, #fff6fa 0%, transparent 35%),
    radial-gradient(circle at 80% 80%, #fff1f6 0%, transparent 35%),
    linear-gradient(135deg, #f8dce7, #f5eef3);
  overflow: hidden;
}

/* =========================================
   PANTALLA DEL SOBRE
========================================= */

.inicio {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  transition: opacity 1s ease, transform 1s ease;
}

.pequeno-texto {
  color: #9b667b;
  font-size: 17px;
  letter-spacing: 1px;
  margin-bottom: 28px;
  animation: respirar 2.5s ease-in-out infinite;
}

.sobre {
  width: 340px;
  height: 235px;
  position: relative;
  cursor: pointer;
  filter: drop-shadow(0 18px 25px rgba(100, 60, 75, .20));
  transition: transform .35s ease;
}

.sobre:hover {
  transform: translateY(-5px) scale(1.02);
}

.nombre-sobre {
  margin-top: 18px;
  color: #c75d7c;
  font-size: 24px;
  font-style: italic;
  letter-spacing: .5px;
  animation: respirar 2.5s ease-in-out infinite;
}

/* cuerpo */

.sobre-base {
  position: absolute;
  inset: 0;
  background: #fce3ec;
  border-radius: 7px;
  overflow: hidden;
}

/* parte inferior izquierda */

.sobre-base::before {
  content: "";
  position: absolute;
  left: 0;
  bottom: 0;

  border-left: 170px solid #f1ccd9;
  border-top: 118px solid transparent;
  border-bottom: 118px solid transparent;
}

/* parte inferior derecha */

.sobre-base::after {
  content: "";
  position: absolute;
  right: 0;
  bottom: 0;

  border-right: 170px solid #edc4d3;
  border-top: 118px solid transparent;
  border-bottom: 118px solid transparent;
}

/* solapa */

.solapa {
  position: absolute;
  z-index: 5;
  left: 0;
  top: 0;

  width: 0;
  height: 0;

  border-left: 170px solid transparent;
  border-right: 170px solid transparent;
  border-top: 125px solid #eeb4c9;

  transform-origin: top center;
  transition: transform 1.1s cubic-bezier(.65,0,.35,1);
}

/* carta que asoma */

.papel {
  display: none;
  position: absolute;
  z-index: 3;

  left: 25px;
  right: 25px;
  bottom: 8px;

  height: 170px;

  background: #fff;
  border-radius: 5px;

  box-shadow: 0 2px 8px rgba(0,0,0,.08);

  transform: translateY(115px);

  transition: transform 1.2s ease;
}

.papel::before {
  content: "";
  position: absolute;

  top: 30px;
  left: 0;
  width: 100%;

  text-align: center;

  color: #c27a93;
  font-size: 23px;
  font-style: italic;
}

/* sello */


.stitch-face {
  position: relative;
  width: 43px;
  height: 39px;
  background: #4f9ed8;
  border-radius: 48% 48% 45% 45%;
  margin-top: 3px;
  box-shadow: inset 0 -3px 0 rgba(0,0,0,.08);
}

.stitch-ear {
  position: absolute;
  width: 19px;
  height: 29px;
  background: #397fb8;
  top: -12px;
  border-radius: 70% 30% 60% 35%;
  z-index: -1;
}

.stitch-ear.left {
  left: -8px;
  transform: rotate(-28deg);
}

.stitch-ear.right {
  right: -8px;
  transform: scaleX(-1) rotate(-28deg);
}

.stitch-eye {
  position: absolute;
  width: 6px;
  height: 9px;
  background: #171b22;
  border-radius: 50%;
  top: 12px;
}

.stitch-eye.left-eye {
  left: 10px;
}

.stitch-eye.right-eye {
  right: 10px;
}

.stitch-nose {
  position: absolute;
  width: 11px;
  height: 7px;
  background: #25313b;
  border-radius: 50%;
  left: 16px;
  top: 22px;
}

.stitch-mouth {
  position: absolute;
  width: 13px;
  height: 6px;
  border-bottom: 2px solid #25313b;
  border-radius: 50%;
  left: 15px;
  top: 27px;
}

.sello {
  position: absolute;
  z-index: 10;

  left: 50%;
  top: 104px;

  transform: translateX(-50%);

  width: 58px;
  height: 58px;

  border-radius: 50%;

  display: flex;
  justify-content: center;
  align-items: center;

  background: #d86d8d;
  color: white;

  font-size: 28px;

  box-shadow:
    0 4px 8px rgba(120,50,75,.2),
    inset 0 0 0 3px rgba(255,255,255,.25);

  transition: opacity .5s ease, transform .5s ease;
}

/* =========================================
   CARTA ABIERTA
========================================= */

.carta {
  display: none;

  position: relative;

  width: min(92%, 520px);
  min-height: 650px;

  margin: auto;

  padding: 35px 20px 30px;

  background:
    linear-gradient(
      rgba(255,255,255,.97),
      rgba(255,250,252,.97)
    );

  border-radius: 28px;

  box-shadow:
    0 25px 60px rgba(90,50,70,.18),
    inset 0 0 0 1px rgba(210,150,170,.18);

  text-align: center;

  animation: cartaAparece 1.2s ease forwards;

  overflow: hidden;
}

/* detalles decorativos */

.carta::before,
.carta::after {
  content: "♡";

  position: absolute;

  color: #e5a6b9;
  opacity: .45;

  font-size: 40px;
}

.carta::before {
  left: 22px;
  top: 20px;
}

.carta::after {
  right: 22px;
  top: 20px;
}

/* título */

.titulo {
  margin: 0;

  color: #c75d7c;

  font-size: 43px;

  font-weight: normal;

  letter-spacing: .5px;
}

.subtitulo {
  margin-top: 8px;

  color: #a27b89;

  font-size: 17px;

  font-style: italic;
}

/* =========================================
   OSO
========================================= */

.oso {
  position: relative;

  width: 260px;
  height: 325px;

  margin: 22px auto 0;

  animation: balanceo 4s ease-in-out infinite;
}

/* orejas */

.oreja {
  position: absolute;

  width: 72px;
  height: 72px;

  top: 3px;

  background: #8c5a3d;

  border-radius: 50%;

  z-index: 1;
}

.oreja.izquierda {
  left: 25px;
}

.oreja.derecha {
  right: 25px;
}

.oreja::after {
  content: "";

  position: absolute;

  width: 37px;
  height: 37px;

  top: 18px;
  left: 18px;

  border-radius: 50%;

  background: #dca181;
}

/* cabeza */

.cabeza {
  position: absolute;

  width: 195px;
  height: 180px;

  left: 32px;
  top: 27px;

  background: #a96e4b;

  border-radius: 50%;

  z-index: 2;

  box-shadow:
    inset 0 -7px 0 rgba(80,40,25,.06);
}

/* ojos */

.ojo {
  position: absolute;

  width: 15px;
  height: 20px;

  top: 67px;

  background: #29211e;

  border-radius: 50%;
}

.ojo.izquierdo {
  left: 52px;
}

.ojo.derecho {
  right: 52px;
}

/* pequeño brillo */

.ojo::after {
  content: "";

  position: absolute;

  width: 4px;
  height: 5px;

  background: white;

  border-radius: 50%;

  top: 3px;
  left: 4px;
}

/* hocico */

.hocico {
  position: absolute;

  width: 88px;
  height: 68px;

  left: 53px;
  top: 88px;

  background: #dca181;

  border-radius: 50%;
}

.nariz {
  position: absolute;

  width: 29px;
  height: 21px;

  top: 10px;
  left: 30px;

  background: #35231c;

  border-radius: 50%;
}

.boca {
  position: absolute;

  width: 30px;
  height: 15px;

  left: 29px;
  top: 32px;

  border-bottom: 3px solid #35231c;

  border-radius: 50%;
}

/* cuerpo */

.cuerpo {
  position: absolute;

  width: 165px;
  height: 135px;

  left: 48px;
  top: 170px;

  background: #a96e4b;

  border-radius: 50% 50% 42% 42%;

  z-index: 1;
}

/* brazos */

.brazo {
  position: absolute;

  width: 80px;
  height: 47px;

  top: 190px;

  background: #a96e4b;

  border-radius: 50%;

  z-index: 4;
}

.brazo.izquierda {
  left: 18px;
  transform: rotate(32deg);
}

.brazo.derecha {
  right: 18px;
  transform: rotate(-32deg);
}

/* =========================================
   RAMO DE FLORES
========================================= */

.ramo {
  position: absolute;

  z-index: 6;

  left: 82px;
  top: 183px;

  transform: rotate(-8deg);

  animation: ramoSuave 3s ease-in-out infinite;
}

.flores {
  font-size: 65px;

  white-space: nowrap;

  filter: drop-shadow(
    2px 4px 3px rgba(70,40,30,.12)
  );
}

.tallos {
  width: 8px;
  height: 85px;

  margin: -7px auto 0;

  background: #55965c;

  border-radius: 8px;

  transform: rotate(5deg);
}

.lazo {
  margin-top: -23px;

  color: #dc7190;

  font-size: 38px;
}

/* =========================================
   MENSAJE
========================================= */

.mensaje {
  position: relative;

  z-index: 10;

  margin-top: 0;

  color: #66535b;

  font-size: 20px;

  line-height: 1.65;
}

.mensaje strong {
  color: #c75d7c;
}

/* firma */

.firma {
  margin-top: 14px;

  color: #c75d7c;

  font-size: 20px;

  font-style: italic;
}

/* =========================================
   ANIMACIONES
========================================= */

@keyframes respirar {

  0%,100% {
    opacity: .75;
    transform: scale(1);
  }

  50% {
    opacity: 1;
    transform: scale(1.04);
  }
}

@keyframes cartaAparece {

  from {
    opacity: 0;
    transform: translateY(35px) scale(.92);
  }

  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

@keyframes balanceo {

  0%,100% {
    transform: rotate(-1.5deg);
  }

  50% {
    transform: rotate(1.5deg);
  }
}

@keyframes ramoSuave {

  0%,100% {
    transform: rotate(-8deg);
  }

  50% {
    transform: rotate(-4deg);
  }
}

/* =========================================
   MÓVILES
========================================= */

@media (max-width: 450px) {

  .sobre {
    width: 300px;
    height: 205px;
  }

  .solapa {
    border-left-width: 150px;
    border-right-width: 150px;
    border-top-width: 110px;
  }

  .sobre-base::before {
    border-left-width: 150px;
    border-top-width: 103px;
    border-bottom-width: 103px;
  }

  .sobre-base::after {
    border-right-width: 150px;
    border-top-width: 103px;
    border-bottom-width: 103px;
  }

  .sello {
    top: 91px;
  }

  .carta {
    min-height: 620px;
    padding-top: 30px;
  }

  .titulo {
    font-size: 37px;
  }

  .oso {
    transform: scale(.9);
    transform-origin: top center;
    margin-bottom: -25px;
  }

  .mensaje {
    font-size: 18px;
  }
}
</style>
</head>

<body>

<!-- =====================================
     SOBRE INICIAL
===================================== -->

<div class="inicio" id="inicio">

  <div class="pequeno-texto">
    Una pequeña sorpresa para ti 💌
  </div>

  <div class="sobre" onclick="abrirCarta()">

    <div class="papel"></div>

    <div class="sobre-base"></div>

    <div class="solapa" id="solapa"></div>

    <div class="sello" id="sello">
      <div class="stitch-face">
        <div class="stitch-ear left"></div>
        <div class="stitch-ear right"></div>
        <div class="stitch-eye left-eye"></div>
        <div class="stitch-eye right-eye"></div>
        <div class="stitch-nose"></div>
        <div class="stitch-mouth"></div>
      </div>
    </div>

  </div>

</div>


<!-- =====================================
     CARTA ABIERTA
===================================== -->

<div class="carta" id="carta">

  <h1 class="titulo">
    ¡Buen viaje! ✈️
  </h1>

  <div class="subtitulo">
    Con mucho cariño, para ti 💕
  </div>


  <!-- OSO -->

  <div class="oso">

    <div class="oreja izquierda"></div>
    <div class="oreja derecha"></div>

    <div class="cabeza">

      <div class="ojo izquierdo"></div>
      <div class="ojo derecho"></div>

      <div class="hocico">
        <div class="nariz"></div>
        <div class="boca"></div>
      </div>

    </div>

    <div class="cuerpo"></div>

    <div class="brazo izquierda"></div>
    <div class="brazo derecha"></div>


    <!-- RAMO -->

    <div class="ramo">

      <div class="flores">
        🌷🌹🌸
      </div>

      <div class="tallos"></div>

      <div class="lazo">
        🎀
      </div>

    </div>

  </div>


  <!-- MENSAJE -->

  <div class="mensaje">

    Que tengas un maravilloso viaje

    <div class="firma">
      ¡Disfruta muchísimo! 🤗💕
    </div>

  </div>

</div>


<script>

function abrirCarta() {

  const solapa = document.getElementById("solapa");
  const sello = document.getElementById("sello");
  const inicio = document.getElementById("inicio");
  const carta = document.getElementById("carta");

  /* Abrimos la solapa */

  solapa.style.transform = "rotateX(180deg)";

  /* Quitamos el sello */

  sello.style.opacity = "0";

  sello.style.transform =
    "translateX(-50%) scale(.7)";

  /*
    Después de abrir el sobre,
    hacemos salir ligeramente el papel.
  */

  setTimeout(() => {

    document.querySelector(".papel").style.transform =
      "translateY(-20px)";

  }, 400);


  /*
    Después mostramos la carta.
  */

  setTimeout(() => {

    inicio.style.opacity = "0";
    inicio.style.transform = "scale(1.05)";

  }, 1200);


  setTimeout(() => {

    inicio.style.display = "none";
    carta.style.display = "block";

  }, 2000);

}

</script>

</body>
</html>
